name: Deploy

# VRMS spec 0008, CD for a backend. The same file runs in welinc-auth and welinc-backend-vrms; the
# names come from repo variables that infra/scripts/set-repo-variables.sh writes.
#
#   Staging:    every push to development.
#   Production: Actions > Deploy > Run workflow, on main. With no sha it promotes: main moves
#               (fast forward only) to the newest development commit staging deployed, then that
#               commit deploys. With a sha it rolls back to that older main commit, moves nothing
#               and runs no migration.
#
# Every run passes this repo's CI on the exact commit first (the deploy guard, AC-22); a red
# check means no Azure login and no change. Nobody pushes to main by hand.
on:
  push:
    branches: [development]
    # Docs and tests can't change what runs, so they skip the build and the staging deploy
    paths-ignore: ['**.md', '**/*.spec.ts', '**/*.test.ts', '**/*.test.tsx']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Rollback only: an older main commit (all 40 characters). Leave empty to promote what staging runs.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Deploys of one environment queue and never overlap a migration
concurrency:
  group: deploy-${{ github.repository }}-${{ github.event_name == 'push' && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  # Which environment and which commit. The trigger decides the environment, nothing else.
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      sha: ${{ steps.pick.outputs.sha }}
      promote: ${{ steps.pick.outputs.promote }}
      migrate: ${{ steps.pick.outputs.migrate }}
    steps:
      # Production is not hosted (spec 0008 AC-24): a manual run stops here, before the promote job
      # can move main and before any Azure login. Setting AZURE_CLIENT_ID_PROD again lifts it.
      - name: Production is hosted
        if: github.event_name == 'workflow_dispatch'
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PROD }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::production is not hosted: no AZURE_CLIENT_ID_PROD (spec 0008 AC-24)"
            exit 1
          fi
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT" = push ]; then
            out environment staging; out sha "$HEAD_SHA"; out promote false; out migrate true
            exit 0
          fi
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Production runs only from main: pick 'Use workflow from: main'."
            exit 1
          fi
          if [ -n "$INPUT_SHA" ]; then
            if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::sha must be a full commit id: 40 characters, 0 to 9 and a to f."
              exit 1
            fi
            # A rollback (not main's head) skips migrations: they only add, so older code runs on
            # the newer schema, and an old migration job must never run against a newer database
            migrate=false
            [ "$INPUT_SHA" = "$HEAD_SHA" ] && migrate=true
            out environment production; out sha "$INPUT_SHA"; out promote false; out migrate "$migrate"
            exit 0
          fi
          target="$(gh run list -R "$REPO" --workflow deploy.yml --branch development --event push \
            --status success --limit 1 --json headSha -q '.[0].headSha // ""')"
          if [ -z "$target" ]; then
            echo "::error::No successful staging deploy yet, so there is nothing to promote."
            exit 1
          fi
          echo "Promoting $target, the newest commit staging deployed."
          out environment production; out sha "$target"; out promote true; out migrate true

  # The only job that can write: moves main forward to the commit staging deployed. A plain push
  # fails when main holds a commit development doesn't, and then nothing deploys. A push made with
  # the workflow token starts no other workflow.
  promote:
    needs: target
    if: needs.target.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - env:
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" origin/development \
            || { echo "::error::$SHA is not on development."; exit 1; }
          git push origin "$SHA:refs/heads/main"

  # The deploy guard (AC-22): this repo's own CI on exactly the commit being deployed
  ci:
    needs: [target, promote]
    if: ${{ !cancelled() && needs.target.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.sha }}

  deploy:
    needs: [target, ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
      SHA: ${{ needs.target.outputs.sha }}
      MIGRATE: ${{ needs.target.outputs.migrate }}
      # Staging and production share one Container Apps environment, so every app and job name
      # carries its ending (auth-service-staging, auth-service-prod); the images keep the base
      # name, so production deploys the image staging built (VRMS spec 0008 AC-23)
      APP: ${{ needs.target.outputs.environment == 'staging' && vars.CONTAINER_APP_STAGING || vars.CONTAINER_APP_PROD }}
      JOB: ${{ needs.target.outputs.environment == 'staging' && vars.MIGRATE_JOB_STAGING || vars.MIGRATE_JOB_PROD }}
      IMAGE_REPO: ${{ vars.IMAGE_REPO }}
      ACR: ${{ vars.ACR_NAME }}
      RG: ${{ needs.target.outputs.environment == 'staging' && vars.RESOURCE_GROUP_STAGING || vars.RESOURCE_GROUP_PROD }}
      API_URL: ${{ needs.target.outputs.environment == 'staging' && vars.STAGING_API_URL || vars.PROD_API_URL }}
      PORTAL_URL: ${{ needs.target.outputs.environment == 'staging' && vars.STAGING_PORTAL_URL || vars.PROD_PORTAL_URL }}
      VRMS_URL: ${{ needs.target.outputs.environment == 'staging' && vars.STAGING_VRMS_URL || vars.PROD_VRMS_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0

      - name: Production only deploys a commit that is on main and development
        if: env.ENVIRONMENT == 'production'
        run: |
          set -euo pipefail
          git fetch -q origin main development
          for b in main development; do
            git merge-base --is-ancestor "$SHA" "origin/$b" \
              || { echo "::error::$SHA is not on $b."; exit 1; }
          done

      # A short lived OpenID Connect pass, no stored password (AC-11). The login trusts only
      # development for staging and only main for production.
      - uses: azure/login@v3
        with:
          client-id: ${{ env.ENVIRONMENT == 'staging' && vars.AZURE_CLIENT_ID_STAGING || vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Image names
        run: |
          set -euo pipefail
          [ -n "$APP" ] && [ -n "$JOB" ] && [ -n "$IMAGE_REPO" ] \
            || { echo "::error::Set the repo variables CONTAINER_APP_<ENV>, MIGRATE_JOB_<ENV> and IMAGE_REPO (the workspace's infra/scripts/set-repo-variables.sh)."; exit 1; }
          server="$(az acr show -n "$ACR" --query loginServer -o tsv)"
          {
            echo "IMAGE=$server/$IMAGE_REPO:$SHA"
            echo "SEED_IMAGE=$server/$IMAGE_REPO-seed:$SHA"
            echo "SUFFIX=r${SHA:0:7}-${{ github.run_attempt }}"
          } >> "$GITHUB_ENV"

      # Staging builds both images; production reuses the ones staging built and tested
      - name: Build and push the images
        if: env.ENVIRONMENT == 'staging'
        run: |
          set -euo pipefail
          az acr login -n "$ACR"
          docker build -f Dockerfile.prod --target runner --build-arg GIT_SHA="$SHA" -t "$IMAGE" .
          docker build -f Dockerfile.prod --target seed -t "$SEED_IMAGE" .
          docker push "$IMAGE"
          docker push "$SEED_IMAGE"

      - name: Both images exist
        if: env.ENVIRONMENT == 'production'
        run: |
          set -euo pipefail
          for img in "$IMAGE_REPO:$SHA" "$IMAGE_REPO-seed:$SHA"; do
            az acr repository show -n "$ACR" --image "$img" -o none \
              || { echo "::error::$img is not in the registry. Deploy this commit to staging first."; exit 1; }
          done

      # AC-6: env:check, then the migrations, as the owner role, before the new revision takes
      # traffic. A failure stops here and the old revision keeps serving.
      - name: Migrate
        if: env.MIGRATE == 'true'
        run: |
          set -euo pipefail
          # The command is set on the job, not given at start: a start override replaces the whole
          # container, settings and secrets included. No argument may start with a dash (the Azure
          # CLI takes "-c" as its own option), so the check and the migration are one npm script.
          az containerapp job update -n "$JOB" -g "$RG" --image "$SEED_IMAGE" \
            --command npm --args run db:deploy:job -o none
          execution="$(az containerapp job start -n "$JOB" -g "$RG" --query name -o tsv)"
          echo "Started $execution"
          status=Running
          for _ in $(seq 1 66); do
            sleep 10
            status="$(az containerapp job execution show -n "$JOB" -g "$RG" \
              --job-execution-name "$execution" --query properties.status -o tsv)"
            case "$status" in Succeeded|Failed|Stopped|Degraded) break ;; esac
          done
          echo "Migration job: $status"
          if [ "$status" != Succeeded ]; then
            az containerapp job logs show -n "$JOB" -g "$RG" --container "$JOB" \
              --execution "$execution" --format text --tail 200 || true
            echo "::error::The migration job ended $status. Nothing was deployed."
            exit 1
          fi

      - name: New revision
        run: az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" --revision-suffix "$SUFFIX" -o none

      # AC-6: done only when the revision named after this commit and attempt is ready and holds
      # all traffic. On timeout the old revision keeps serving.
      - name: Wait for the revision
        run: |
          set -euo pipefail
          revision="$APP--$SUFFIX"
          for _ in $(seq 1 36); do
            app="$(az containerapp show -n "$APP" -g "$RG" -o json)"
            ready="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$app")"
            latest="$(jq -r '.properties.latestRevisionName // ""' <<<"$app")"
            if [ "$ready" = "$revision" ]; then
              weight="$(az containerapp revision show -n "$APP" -g "$RG" --revision "$revision" \
                --query properties.trafficWeight -o tsv)"
              [ "$weight" = 100 ] && { echo "$revision is ready and holds 100% of traffic."; exit 0; }
            fi
            state="$(az containerapp revision show -n "$APP" -g "$RG" --revision "$revision" \
              --query properties.runningState -o tsv 2>/dev/null || true)"
            if [ "$latest" = "$revision" ] && [ "$state" = Failed ]; then
              echo "::error::$revision failed to start. The previous revision keeps serving."
              exit 1
            fi
            sleep 10
          done
          echo "::error::$revision was not ready with all traffic after 6 minutes. The previous revision keeps serving."
          exit 1

      # AC-9: every health route (each checks its database) and both web apps, for up to 3 minutes
      # (a staging app that scaled to zero answers 504 while it wakes)
      - name: Smoke test
        run: |
          set -euo pipefail
          urls=("$API_URL/health" "$API_URL/auth/health" "$API_URL/vrms/health" "$PORTAL_URL/" "$VRMS_URL/")
          deadline=$((SECONDS + 180))
          for url in "${urls[@]}"; do
            until code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")" && [ "$code" = 200 ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$url answered ${code:-nothing}, not 200."
                exit 1
              fi
              sleep 10
            done
            echo "ok  $url"
          done
